name: strawhut
description: 去中心化加密知识分享平台
publish_to: 'none'

version: 1.2.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 富文本编辑器
  flutter_quill: ^11.5.0
  flutter_quill_extensions: ^11.0.0-dev.7

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 加密相关
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  crypto: ^3.0.6
  ffi: ^2.1.0

  # 文件操作
  file_picker: ^8.1.7
  image: ^4.3.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # 多媒体支持
  video_player: ^2.8.0
  audioplayers: ^5.0.0
  flutter_markdown: ^0.7.0
  syncfusion_flutter_pdfviewer: ^33.2.13

  # 路由导航
  go_router: ^14.6.2

  # 桌面端拖拽
  desktop_drop: ^0.5.0

  # Android 平台支持
  share_plus: ^10.1.3
  receive_sharing_intent: ^1.8.0
  permission_handler: ^11.3.1
  media_scanner: ^2.1.0
  image_picker: ^1.1.2

  # 安全存储
  flutter_secure_storage: ^9.2.4

  # 应用信息
  package_info_plus: ^8.3.0

  # JSON 序列化
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

  # 线性细描边图标（Neumorphism 风格，纯 Dart 包，无原生依赖）
  flutter_svg: ^2.0.9


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.0
  very_good_analysis: ^7.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
